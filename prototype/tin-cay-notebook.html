<title>Tin Cậy Family Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap">
<style>
/* Layout: one-column phone notebook; sticky header, scrolling program, fixed bottom tab bar. */
:root{
  --paper:#F3F5F8; --card:#FFFFFF; --ink:#16243A; --muted:#5A6779; --line:#DAE1EA;
  --sky:#2C5A88; --sky-soft:#E2EBF5; --gold:#A8751F; --gold-soft:#F6EAD3; --ok:#2B7A57; --ok-soft:#DDF1E7; --warn:#B0501B;
  --on-sky:#FFFFFF;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1521; --card:#162031; --ink:#E7ECF3; --muted:#9BA8BA; --line:#283447;
  --sky:#8DB8E4; --sky-soft:#1C2C42; --gold:#E3B35E; --gold-soft:#3A2E1A; --ok:#62C79B; --ok-soft:#173327; --warn:#E8925E;
  --on-sky:#0E1521; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1521; --card:#162031; --ink:#E7ECF3; --muted:#9BA8BA; --line:#283447;
  --sky:#8DB8E4; --sky-soft:#1C2C42; --gold:#E3B35E; --gold-soft:#3A2E1A; --ok:#62C79B; --ok-soft:#173327; --warn:#E8925E;
  --on-sky:#0E1521; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
a{color:var(--sky)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--sky-soft);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky);color:var(--on-sky)}
.me-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:600}
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sky-soft);color:var(--ink)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--ok)} .pill.wait .dot{background:var(--gold)} .pill.off .dot{background:var(--warn)}

/* Avatars */
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.av.lg{width:52px;height:52px;font-size:20px}

main{padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--sky)}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:#fff;font-size:10px;display:grid;place-items:center}

/* Theme card */
.theme{padding:18px;border-radius:var(--r);background:linear-gradient(160deg,var(--sky-soft),var(--card));border:1px solid var(--line);display:grid;gap:6px}
.theme .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.theme h1{font-size:23px}
.theme .ref{font-weight:600;color:var(--gold);font-size:13px}
.vi-sub{display:block;color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:.82em;margin-top:2px}

.now{margin-top:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);font-size:13.5px}
.now b{color:var(--gold)}
.now button{margin-left:auto;border:0;background:var(--gold);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;flex:none}

.session-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.session-h h2{font-size:20px}
.session-h span{font-size:12px;color:var(--muted)}

/* Program list */
.prog{display:grid;gap:10px}
.slim{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted);padding:4px 2px}
.slim .tm{width:44px;font-variant-numeric:tabular-nums;font-weight:600}
.part{display:grid;grid-template-columns:44px 1fr;gap:12px}
.part .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;padding-top:15px;color:var(--muted)}
.part.is-now .tm{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:grid;gap:10px}
.part.is-now .card{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sky);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kicker .nowtag{background:var(--gold);color:#fff;padding:1px 7px;border-radius:999px;letter-spacing:.04em}
.card h3{font-size:17px}
.subparts{display:grid;gap:10px;padding-left:12px;border-left:2px dashed var(--line)}
.subparts .card h3{font-size:16px}
.rq{font-size:13px;background:var(--sky-soft);border-radius:10px;padding:8px 10px}
.rq b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sky);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500;text-align:left}
.chip .en{color:var(--muted);font-weight:400}
.chip.open{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}

label.lbl{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
textarea.note{width:100%;min-height:86px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:2px 10px;background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,color-mix(in srgb,var(--line) 85%,transparent) 27px,color-mix(in srgb,var(--line) 85%,transparent) 28px);
  background-attachment:local;line-height:28px;font-size:15px}
textarea.note:focus{outline:none;border-color:var(--sky)}
.note-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.btn.pri{background:var(--sky);border-color:var(--sky);color:var(--on-sky)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.saved{font-size:11.5px;color:var(--muted)}
.fam{display:grid;gap:8px}
.fam-h{font-size:12px;font-weight:600;color:var(--muted)}
.fnote{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:14px}
.fnote .who{font-size:12px;font-weight:700}
.fnote .who span{font-weight:400;color:var(--muted)}
.fnote p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

/* Games */
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.subnav button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.score{display:grid;gap:6px;margin-bottom:14px}
.srow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--sky-soft);overflow:hidden;grid-column:2 / 3}
.bar i{display:block;height:100%;border-radius:4px}
.srow b{font-variant-numeric:tabular-nums}
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tile{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:600;line-height:1.2;overflow:hidden;overflow-wrap:anywhere}
.tile small{font-weight:400;color:var(--muted);font-size:10px}
.tile.on{background:var(--gold);border-color:var(--gold);color:#fff}
.tile.on small{color:#fff;opacity:.85}
.tile.free{background:var(--sky);border-color:var(--sky);color:var(--on-sky)}
.tile.win{box-shadow:inset 0 0 0 3px var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.verse{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px}
.verse input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.verse .vtxt{flex:1;min-width:0}
.verse .vtxt small{display:block;color:var(--muted)}
.verse.done{background:var(--gold-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:8px;min-width:0}
.mbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-size:14px;font-weight:600;text-align:left;min-height:48px;overflow-wrap:anywhere}
.mbtn.sel{border-color:var(--sky);background:var(--sky-soft)}
.mbtn.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mbtn.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Words */
.wgrid{display:grid;gap:8px}
.word{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.word .vi{font-size:17px;font-weight:600}
.word .pr{font-size:13px;color:var(--sky);font-style:italic}
.word .mean{font-size:14px}
.word .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.src{padding:1px 7px;border-radius:999px;font-weight:600}
.src.prog{background:var(--ok-soft);color:var(--ok)}
.src.unv{background:var(--gold-soft);color:var(--gold)}
.reveal{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--muted);justify-self:start}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:grid;grid-template-columns:26px 1fr;gap:8px;max-width:100%}
.msg .bub{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 11px;min-width:0}
.msg.mine{grid-template-columns:1fr 26px}
.msg.mine .bub{background:var(--sky-soft);border-color:transparent;border-radius:14px 4px 14px 14px;order:-1}
.msg .who{font-size:11.5px;font-weight:700;display:flex;gap:6px;align-items:baseline}
.msg .who span{font-weight:400;color:var(--muted)}
.msg p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tr{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.linkbtn{border:0;background:none;padding:0;font-size:11.5px;font-weight:600;color:var(--sky)}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:25;background:var(--paper);border-top:1px solid var(--line)}
.composer .wrap{display:flex;gap:8px;padding-block:8px}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:18px;padding:8px 14px;background:var(--card);max-height:120px;font-size:15px}
.has-composer main{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.ai .bub{background:var(--card)}
.ai-a .bub{border-left:3px solid var(--gold)}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.quick button{flex:none}
.notice{font-size:12.5px;color:var(--muted);background:var(--sky-soft);border-radius:10px;padding:8px 10px;margin-bottom:12px}

/* Overlay */
.ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border-radius:16px;max-width:440px;width:100%;padding:20px;display:grid;gap:14px;max-height:90%;overflow:auto}
.sheet h2{font-size:21px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.person{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 6px;display:grid;justify-items:center;gap:6px;font-weight:600;font-size:13px;overflow-wrap:anywhere}
.person[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.seg button{padding:5px 8px}.brand small{display:none}}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand" id="brand">Tin Cậy Notebook<small>Circuit Assembly 2026–2027</small></div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" data-lang="en">EN</button>
        <button id="lang-both" data-lang="both">EN+VI</button>
        <button id="lang-vi" data-lang="vi">VI</button>
      </div>
      <button class="me-chip" id="me-chip" aria-label="Switch person"></button>
    </div>
    <div class="sub-row"><span id="sync" class="pill"><span class="dot"></span><span id="sync-t">Starting…</span></span><span id="clock"></span></div>
  </div>
</header>

<main><div class="wrap" id="main"></div></main>

<div class="composer" id="composer" hidden><div class="wrap">
  <textarea id="compose" rows="1"></textarea>
  <button class="btn pri" id="send">Send</button>
</div></div>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button data-tab="program" id="tab-program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg><span></span></button>
  <button data-tab="games" id="tab-games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></svg><span></span></button>
  <button data-tab="words" id="tab-words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h9M8.5 4v2M6 6c1 4 4 7 7 8M12 6c-1 4-4 7-7 8"/><path d="M13 20l4-9 4 9M14.5 17h5"/></svg><span></span></button>
  <button data-tab="chat" id="tab-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg><span></span><i class="badge" id="chat-badge" hidden></i></button>
  <button data-tab="ask" id="tab-ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg><span></span></button>
</div></nav>

<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

function view(prefix){ const out={}; for(const [p,d] of Object.entries(S.docs)) if(p.startsWith(prefix)) out[p]=d; for(const [p,it] of Object.entries(S.pending)) if(p.startsWith(prefix)) out[p]=it.data; return out; }

let flushT, flushing=false;
function write(path,data){
  const prev=S.pending[path]; S.pending[path]={data, v:(prev?prev.v:0)+1};
  saveLocal(); setSync(); clearTimeout(flushT); flushT=setTimeout(flush,700);
}
async function flush(){
  if(!DB||flushing||S.readOnly) { setSync(); return; }
  const keys=Object.keys(S.pending); if(!keys.length){ setSync(); return; }
  flushing=true;
  for(const p of keys){
    const it=S.pending[p]; if(!it) continue;
    try{
      await DB.doc(p).set(it.data);
      S.docs[p]=it.data;
      if(S.pending[p] && S.pending[p].v===it.v) delete S.pending[p];
    }catch(e){
      if(e && e.code==='invalid_argument'){ S.readOnly=true; break; }
      if(e && e.code==='quota_exceeded'){ toast('The family notebook is full. Clear old chat to keep saving.'); break; }
      break; /* no signal: try again later */
    }
  }
  flushing=false; saveLocal(); setSync();
}
setInterval(()=>{ if(Object.keys(S.pending).length) flush(); }, 15000);
window.addEventListener('online', ()=>{ setSync(); flush(); });
window.addEventListener('offline', setSync);

function setSync(){
  const el=$('sync'), t=$('sync-t'); const n=Object.keys(S.pending).length;
  let cls='ok', txt=u('synced');
  if(S.readOnly){cls='off';txt=u('readonly');}
  else if(!DB && S.dbState!=='connecting'){cls='wait';txt=u('local');}
  else if(!navigator.onLine){cls='off';txt=u('offline');}
  else if(n||S.dbState==='connecting'){cls='wait';txt=S.dbState==='connecting'?'…':u('waiting');}
  el.className='pill '+cls; t.textContent=txt;
}
function replacePrefix(prefix, docs){
  for(const p of Object.keys(S.docs)) if(p.startsWith(prefix)) delete S.docs[p];
  for(const d of docs) S.docs[prefix+d.id]=d.data();
  saveLocal();
}
async function connect(){
  try{ DB = await window.claude?.use?.('db') ?? null; }catch(e){ DB=null; }
  S.dbState = DB?'on':'none';
  if(DB){
    const onErr=()=>{ setSync(); };
    DB.doc('family/roster').onSnapshot(s=>{ if(s.exists) S.docs['family/roster']=s.data(); saveLocal(); onData('roster'); }, onErr);
    DB.collection('notes').onSnapshot(q=>{ replacePrefix('notes/', q.docs); onData('notes'); }, onErr);
    DB.collection('game').onSnapshot(q=>{ replacePrefix('game/', q.docs); onData('game'); }, onErr);
    DB.collection('chat').orderBy('ts','desc').limit(300).onSnapshot(q=>{ replacePrefix('chat/', q.docs); onData('chat'); }, onErr);
    flush();
  }
  setSync();
  if(!me()) showPicker();
}

function toMin(t){ let [h,m]=t.split(':').map(Number); if(h<8) h+=12; return h*60+m; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function currentItem(){
  const all=PROGRAM.flatMap(s=>s.items); const n=nowMin();
  for(let i=0;i<all.length;i++){ const st=toMin(all[i].t), en=i+1<all.length?toMin(all[i+1].t):toMin('4:10'); if(n>=st&&n<en) return all[i]; }
  return null;
}

function closePicker(){ $('overlay').innerHTML=''; }
function addPerson(name){
  name=name.trim(); if(!name) return; const ppl=roster().slice(); if(ppl.length>=7) return;
  const used=new Set(ppl.map(p=>p.color)); const color=COLORS.find(c=>!used.has(c))||COLORS[ppl.length%7];
  const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:name.slice(0,20), color};
  ppl.push(p); write('family/roster',{people:ppl}); S.me=p.id; LS.set('tc_me',p.id); closePicker(); render(); toast((S.lang==='vi'?'Xin chào, ':'Welcome, ')+p.name);
}

/* ============ EVENTS ============ */
document.addEventListener('click', e=>{
  const t=e.target.closest('button,a,input'); if(!t) return;
  const d=t.dataset;
  if(d.lang){ S.lang=d.lang; LS.set('tc_lang',S.lang); render(); return; }
  if(d.tab){ S.tab=d.tab; LS.set('tc_tab',S.tab); render(); window.scrollTo(0,0); if(S.tab==='chat'||S.tab==='ask') scrollEnd(); return; }
  if(t.id==='me-chip'){ showPicker(); return; }
  if(d.pick){ S.me=d.pick; LS.set('tc_me',S.me); closePicker(); render(); return; }
  if(t.id==='pk-add'){ addPerson($('pk-name').value); return; }
  if(t.id==='pk-close'){ closePicker(); return; }
  if(d.chip){ S.open[d.chip]=!S.open[d.chip]; if(S.lang==='vi'&&S.open[d.chip]) S.reveal[d.chip]=true; t.outerHTML=vocabChipsOne(d.chip); return; }
  if(d.jump){ const el=$('p-'+d.jump); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(d.tryvi){ const ta=$('note-'+d.tryvi); const txt=(ta&&ta.value.trim()); if(!txt){ toast(S.lang==='vi'?'Hãy viết ghi chú trước':'Write a note first'); return; } S.tab='ask'; LS.set('tc_tab','ask'); askAI(`Help me say my note in simple Vietnamese, sentence by sentence, with pronunciation:\n\n${txt}`); return; }
  if(d.gtab){ S.gtab=d.gtab; LS.set('tc_gtab',S.gtab); render(); return; }
  if(d.bsess){ S.bsess=d.bsess; render(); return; }
  if(d.tile!==undefined){ if(!S.me) return showPicker(); const g=structuredClone(gameDoc(S.me)); g.bingo=g.bingo||{am:[],pm:[]}; const arr=g.bingo[S.bsess]=g.bingo[S.bsess]||[]; const wi=+d.tile; const before=bingoLines(S.me,S.bsess,arr).length; const ix=arr.indexOf(wi); if(ix>=0) arr.splice(ix,1); else arr.push(wi); saveGame(g); const after=bingoLines(S.me,S.bsess,arr).length; if(after>before) toast('BINGO! +5'); render(); return; }
  if(d.verse){ if(!S.me) return showPicker(); const g=structuredClone(gameDoc(S.me)); const v=new Set(g.verses||[]); t.checked?v.add(d.verse):v.delete(d.verse); g.verses=[...v]; saveGame(g); render(); return; }
  if(t.id==='verse-add-btn'){ const i=$('verse-add'); const val=i.value.trim(); if(!val) return; const g=structuredClone(gameDoc(S.me)); g.custom=[...(g.custom||[]),val.slice(0,60)]; saveGame(g); render(); return; }
  if(d.delverse!==undefined){ const g=structuredClone(gameDoc(S.me)); g.custom=(g.custom||[]).filter((_,i)=>i!==+d.delverse); saveGame(g); render(); return; }
  if(d.ml!==undefined){ M.sel=+d.ml; drawMatch(); return; }
  if(d.mr!==undefined){ if(M.sel===null) return; const r=+d.mr; if(r===M.sel){ M.done.add(r); M.sel=null; if(M.done.size===M.pick.length && S.me){ const g=structuredClone(gameDoc(S.me)); g.wm=(g.wm||0)+1; saveGame(g); setTimeout(renderScoreOnly,50);} drawMatch(); } else { t.classList.remove('bad'); void t.offsetWidth; t.classList.add('bad'); } return; }
  if(t.id==='match-new'){ startMatch(); return; }
  if(d.wf){ S.wfilter=d.wf; render(); return; }
  if(d.reveal){ S.reveal[d.reveal]=true; render(); return; }
  if(d.askword){ S.tab='ask'; LS.set('tc_tab','ask'); askAI(`Teach me the word “${d.askword}”: meaning, pronunciation (North and South), and one simple example sentence I could use at the assembly.`); return; }
  if(d.trans){ translateMsg(d.trans); return; }
  if(d.quick){ askAI(d.quick); return; }
  if(t.id==='ai-clear'){ LS.set(aiKey(),[]); render(); return; }
  if(t.id==='send'){ doSend(); return; }
});
function vocabChipsOne(id){ const [key,i]=id.split('_'); const w=VOCAB[key].w[+i]; const open=S.open[id];
  return `<button class="chip ${open?'open':''}" data-chip="${id}" lang="vi">${esc(w[0])}${open?` <span class="en">· ${esc(w[1])} · ${esc(w[2])}</span>`:''}</button>`; }
function doSend(){ const c=$('compose'); const v=c.value.trim(); if(!v) return; c.value=''; c.style.height='auto'; if(S.tab==='chat') sendChat(v); else askAI(v); }
$('compose').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches){ e.preventDefault(); doSend(); } });
document.addEventListener('keydown', e=>{ if(e.target.id==='pk-name' && e.key==='Enter'){ e.preventDefault(); addPerson(e.target.value); } if(e.target.id==='verse-add' && e.key==='Enter'){ e.preventDefault(); $('verse-add-btn').click(); } });

/* Live data updates without wiping what someone is typing */
let dataT; function onData(kind){
  clearTimeout(dataT); dataT=setTimeout(()=>{
    if(kind==='roster'){ renderChrome(); if(!me() && !$('overlay').innerHTML) showPicker(); else if($('overlay').innerHTML && !($('pk-name')&&$('pk-name').value)) showPicker(); }
    if(S.tab==='program' || (S.tab==='games' && S.gtab==='review')){ fillNotes(); renderScoreOnly(); }
    else if(S.tab==='games' && S.gtab!=='match' && kind!=='chat'){ const y=window.scrollY; render(); window.scrollTo(0,y); }
    else if(S.tab==='games'){ renderScoreOnly(); }
    if(S.tab==='chat' && kind==='chat'){ const atEnd=(window.innerHeight+window.scrollY)>=document.body.scrollHeight-80; $('main').innerHTML=renderChat(); markChatSeen(); if(atEnd) scrollEnd(); }
    updateChatBadge();
  },120);
}
setInterval(()=>{ $('clock').textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); if(S.tab==='program' && !document.activeElement?.matches('textarea')){ const cur=currentItem(); const marked=document.querySelector('.part.is-now'); if(((cur&&cur.id)||null)!==(marked?marked.id.slice(2):null)) { const y=window.scrollY; render(); window.scrollTo(0,y);} } }, 60000);
try{ navigator.wakeLock?.request('screen').catch(()=>{}); }catch(e){}

render();
connect();
connectAI().then(()=>{ S.aiChecked=true; if(S.tab==='ask') render(); });
</script>
