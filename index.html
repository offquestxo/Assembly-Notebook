<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tin Cậy Notebook</title>
<meta name="description" content="Family notebook and quiet listening games for the 2026–2027 Circuit Assembly.">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1521" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tin Cậy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand" id="brand">Tin Cậy Notebook<small>Circuit Assembly 2026–2027</small></div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" data-lang="en">EN</button>
        <button id="lang-both" data-lang="both">EN+VI</button>
        <button id="lang-vi" data-lang="vi">VI</button>
      </div>
      <button class="me-chip" id="me-chip" aria-label="Switch person"></button>
    </div>
    <div class="sub-row"><span id="sync" class="pill" role="status"><span class="dot"></span><span id="sync-t">Starting…</span></span><span id="clock"></span></div>
  </div>
</header>

<main><div class="wrap" id="main"></div></main>

<div class="composer" id="composer" hidden><div class="wrap">
  <textarea id="compose" rows="1" aria-label="Message"></textarea>
  <button class="btn pri" id="send">Send</button>
</div></div>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button data-tab="program" id="tab-program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg><span></span></button>
  <button data-tab="games" id="tab-games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></svg><span></span></button>
  <button data-tab="words" id="tab-words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h9M8.5 4v2M6 6c1 4 4 7 7 8M12 6c-1 4-4 7-7 8"/><path d="M13 20l4-9 4 9M14.5 17h5"/></svg><span></span></button>
  <button data-tab="chat" id="tab-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span></span><i class="badge" id="chat-badge" hidden></i></button>
  <button data-tab="ask" id="tab-ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg><span></span></button>
</div></nav>

<div id="overlay"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
